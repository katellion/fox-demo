<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Spine PixiJS Fox</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.2.4/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@esotericsoftware/spine-pixi@4.2.29/dist/iife/spine-pixi.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      height: 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<script>
  const app = new PIXI.Application({
    backgroundColor: 0x111111,
    resizeTo: window
  });
  document.body.appendChild(app.view);

  app.loader
    .add("fox", "fox.json")
    .load((loader, resources) => {
      const fox = new spine.Spine(resources.fox.spineData);
      fox.x = app.screen.width / 2;
      fox.y = app.screen.height;
      fox.scale.set(1);
      fox.state.setAnimation(0, "idle", true);
      app.stage.addChild(fox);
    });
</script>
</body>
</html>
